<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="css/home.css">
    <script src="JS/main.js" defer></script>
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> -->
</head>

<body>
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">
                <img src="images/home/logo_quiz.png" alt="Quiz App Logo">
            </div>
        </div>
        <div class="nav-right">
            <ul>
                <ul>
                    <li><a class="active" href="#"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="pages/over_view.html"><i class="fas fa-info-circle"></i> Overview</a></li>
                    <li><a href="pages/score.html"><i class="fas fa-trophy"></i> Score</a></li>
                    <li ><a href="customize.html" ><i class="fas fa-cogs"></i> Customize</a></li>
                </ul>
            </ul>
            <button>Login</button>
        </div>
    </nav>
    <main>
        <h1>Welcome to Quiz app</h1>
        <a href="customize.html"><button class="play-btn">PLAY NOW !</button></a> 
        <div class="content">
            <img src="images/home/Group 6.png" alt="">
            <div class="text">
                <h2>Hello World !</h2>
                <p>Add excitement and interaction with a live quiz! Whether serious or casual, our free quiz maker
                    ensures it’s fun and engaging.</p>
            </div>
        </div>
    </main>

    <div class="create-quiz">
        <form action="create">
            <div class="setting">
                <div class="type">
                    <label for="type">Type:</label>
                    <select id="choice" name="choice">
                        <option value="multiple">Multiple choice</option>
                        <option value="true/false">True/False</option>
                    </select>
                </div>
                <div class="point">
                    <label for="point">Poin:</label>
                    <select id="total-point" name="total-point">
                        <option value="one">10 pt</option>
                        <option value="two">20 pt</option>
                    </select>
                </div>
                <div class="time">
                    <label for="time">Time:</label>
                    <input type="number" id="score" name="score" min="0" max="100" required>
                </div>
                <button><i class="fa fa-save"></i>Saved</button>
            </div>
            <div class="form-question">
                <label for="question">Question
                    <input type="text" name="question" placeholder="Enter the question here">
                </label>
            </div>
            <div class="form-answer">
                <div class="topic">
                    <p>Answer</p>
                    <p>Correct</p>
                    <p>Delete</p>
                </div>
                <div class="form-question">
                    <label for="question">Answer: A
                        <input type="text" name="question">
                    </label>
                    <input type="checkbox" id="vehicle1" name="vehicle1" value="True">
                    <i class="material-icons">delete</i>

                </div>
                <div class="form-question">
                    <label for="question">Answer: B
                        <input type="text" name="question">
                    </label>
                    <input type="checkbox" id="vehicle1" name="vehicle1" value="True">
                    <i class="material-icons">delete</i>

                </div>
                <div class="form-question">
                    <label for="question">Answer: C
                        <input type="text" name="question">
                    </label>
                    <input type="checkbox" id="vehicle1" name="vehicle1" value="True">
                    <i class="material-icons">delete</i>
                </div>
                <button id="add-answer">Add More Answer</button>

            </div>
        </form>
        <div class="box-question">
            <div class="store-question">
                <input type="text" name="question" placeholder="1.">
                <i class="material-icons">delete</i>
            </div>

        </div>
    </div>
    

</body>

</html>
