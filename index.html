<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/home.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <nav class="navbar">
      <div class="nav-left">
          <div class="logo">
              <img src="images/home/logo_quiz.png" alt="Quiz App Logo">
          </div>
      </div>
      <div class="nav-right">
          <ul>
              <li><a class="active" href="#"> Home</a></li>
              <li><a href="overview.html"></i> Overview</a></li>
              <li><a href="score.html"> Score</a></li>
              <li><a href="customize.html" id="customizeLink">Customize</a></li>
          </ul>                     
          <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal" aria-label="Login">
            Login
          </button>        
      </div>
        <!-- Form Login -->
        <div class="modal" id="myModal">
          <div class="modal-dialog">
            <div class="modal-content">
              <div class="modal-header">
                <h4 class="modal-title">Login</h4>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                <form action="">
                  <div class="mb-3">
                    <input type="text" class="form-control" id="username" placeholder="Enter your name">
                  </div>
                  <div class="mb-3">
                    <input type="text" class="form-control" id="email" placeholder="Enter Email">
                  </div>
                  <div class="mb-3">
                    <input type="text" class="form-control" id="phone" placeholder="Phone number">
                  </div>
                  <div class="mb-3 d-grid">
                    <button class="btn btn-primary btn-block" id="submit">sumbmit</button>
                  </div>
                </form>
              <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
              </div>
            </div>
          </div>
        </div>      
        </div>
  </nav>
  <main id="main-page">
      <h1>Welcome to Quiz app</h1>
      <a href="customize.html">
          <button id="play-btn">PLAY NOW !</button>
      </a> 
      <div class="content">
          <img src="images/home/Group 6.png" alt="">
          <div class="text">
              <h2>Hello World !</h2>
              <p>Add excitement and interaction with a live quiz! Whether serious or casual, our free quiz maker ensures it’s fun and engaging.</p>
          </div>
      </div>
  </main>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-database.js";
    const firebaseConfig = {
      apiKey: "AIzaSyDbdtrYy14RspIi9izQdwpgV72p5GffKVA",
      authDomain: "form-login-77291.firebaseapp.com",
      projectId: "form-login-77291",
      storageBucket: "form-login-77291.firebasestorage.app",
      messagingSenderId: "143179116455",
      appId: "1:143179116455:web:bb5ae63228d54e8dc79082"
    };
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    document.getElementById("submit").addEventListener('click', function(e){
      e.preventDefault();
      set(ref(db, 'user/' + document.getElementById("username").value),
      {
          username: document.getElementById("username").value,
          emaile: document.getElementById("email").value,
          PhoneNumber: document.getElementById("phone").value
      });
          alert("Login Successfull !");
    });
  </script>
  <script src="JS/home.js" defer></script>
</body>
