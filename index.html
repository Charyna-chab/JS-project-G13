<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/home.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="nav">
      <div class="nav-left">
        <div class="logo">
            <img src="images/home/logo_quiz.png" alt="Quiz App Logo">
        </div>
      </div>
      <div class="nav-right">
        <ul>
          <li><a class="active" href="#"> Home</a></li>
          <li><a href="overview.html"> Overview</a></li>
          <li><a href="score.html"> Score</a></li>
          <li><a href="customize.html" id="customizeLink">Customize</a></li>
        </ul>  
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
          Login
        </button>
      </div>                    
  </nav>
     
  <!-- Form Login -->
  <div class="modal" id="myModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
         
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <!-- Login Form -->
        <div id="auth-box">
          <!-- Login Box should be visible by default -->
          <div id="login-box" style="display: block;">
            <div class="left">
              <h1>Login</h1>
              <input type="text" id="loginGmail" name="loginGmail" placeholder="Gmail" />
              <input type="password" id="loginPassword" name="loginPassword" placeholder="Password" />
              <input type="submit" id="loginSubmit" name="login_submit" value="Login" />
              <p>Don't have an account? <a href="#" id="showSignUp">Sign Up</a></p>
            </div>
          </div>

          <!-- Sign-Up Box should be hidden initially -->
          <div id="signUp-box" style="display: none;">
            <div class="left">
              <h1>Sign Up</h1>
              <input type="text" id="username" name="username" placeholder="Username" />
              <input type="text" id="email" name="email" placeholder="E-mail" />
              <input type="password" id="password" name="password" placeholder="Password" />
              <input type="submit" id="signUpBtn" name="signup_submit" value="Sign Up" />
              <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>      

  <main id="main-page">
      <h1>Welcome to Quiz app</h1>
      <a href="customize.html">
          <button id="play-btn">PLAY NOW !</button>
      </a> 
      <div class="content">
          <img src="images/home/Group 6.png" alt="">
          <div class="text">
              <h2>Hello World !</h2>
              <p>Add excitement and interaction with a live quiz! Whether serious or casual, our free quiz maker ensures it’s fun and engaging.</p>
          </div>
      </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-app.js";
    import { getDatabase, ref, set, update} from "https://www.gstatic.com/firebasejs/11.2.0/firebase-database.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.2.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyARe7gLOoWoWNehVT6QiSfvVjicRKSuAPA",
      authDomain: "authentication-app-651f5.firebaseapp.com",
      databaseURL: "https://authentication-app-651f5-default-rtdb.firebaseio.com",
      projectId: "authentication-app-651f5",
      storageBucket: "authentication-app-651f5.firebasestorage.app",
      messagingSenderId: "1063881848632",
      appId: "1:1063881848632:web:305942fe02ffd54c6033cd"
    };
  
    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);
    const auth = getAuth();

    const signUpButton = document.getElementById('signUpBtn');
    const loginButton = document.getElementById('loginSubmit');

    // Sign-Up Event
    signUpButton.addEventListener('click', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const username = document.getElementById('username').value;

      createUserWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          const userRef = ref(database, 'users/' + user.uid);
          set(userRef, {
            username: username,
            email: email
          });
          alert('User created successfully! Welcome, ' + username);
          document.getElementById('myModal').click(); // Close modal after sign-up
        })
        .catch((error) => {
          alert('Error: ' + error.message);
        });
    });

    // Login Event
    loginButton.addEventListener('click', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginGmail').value;
      const password = document.getElementById('loginPassword').value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          const user = userCredential.user;
          const username = user.displayName || 'User';

          const dt = new Date();
          const update = ref(database, 'users/' + user.uid);
          set(update, {
            last_login: dt.toISOString(),
          })
            .then(() => {
              alert('User logged in! ' + username);
              document.getElementById('myModal').click(); // Close modal after login
            })
            .catch((error) => {
              alert('Error updating last login: ' + error.message);
            });
        })
        .catch((error) => {
          alert('Error: ' + error.message);
        });
    });

    // Show Sign-Up Form
    document.getElementById('showSignUp').addEventListener('click', () => {
      document.getElementById('login-box').style.display = 'none';
      document.getElementById('signUp-box').style.display = 'block';
    });

    // Show Login Form
    document.getElementById('showLogin').addEventListener('click', () => {
      document.getElementById('signUp-box').style.display = 'none';
      document.getElementById('login-box').style.display = 'block';
    });
  </script>
  
</body>
</html>
