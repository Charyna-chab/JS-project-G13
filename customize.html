<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize</title>
    <link rel="stylesheet" href="CSS/customize.css">
    <script src="JS/customize.js"defer></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">
                <img src="images/home/logo_quiz.png" alt="Quiz App Logo">
            </div>
        </div>
        <div class="nav-right">
            <ul>
                <ul>
                    <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="pages/over_view.html"><i class="fas fa-info-circle"></i> Overview</a></li>
                    <li><a href="pages/score.html"><i class="fas fa-trophy"></i> Score</a></li>
                    <li><a class="active" href="customize.html"><i class="fas fa-cogs"></i> Customize</a></li>
                </ul>
            </ul>
            <button>Login</button>
        </div>
    </nav>
    <div class="container">
        <h1 id="title-category">What would you like to do?</h1>
        <div class="content" id="content-1">
            <div class="card" id="make-quiz">
                <img src="cus-image/1.png" alt="">
                <h2>Make a Quiz</h2>
                <p>Create your own custom quiz in minutes</p>
            </div>
            <div class="card" id="play-quiz">
                <img src="cus-image/2.png" alt="">
                <h2>Play Quiz</h2>
                <p>Play quiz by choose topic</p>
            </div>
        </div>
        <div class="subjects" id="types-subject"  style="display:none;">
            <h1>Types of subjects</h1>
            <div class="card-type" id="types-subject">
                <div class="card-subject" id="html">
                    <img src="cus-image/html5.png" alt="">
                    <h2>HTML</h2>
                </div>
                <div class="card-subject">
                    <img src="cus-image/css3.png" alt="">
                    <h2>CSS</h2>
                </div>
            </div>
            <div class="card-type">
                <div class="card-subject">
                    <img src="cus-image/english.png" alt="">
                    <h2>ENGLISH</h2>
                </div>
                <div class="card-subject">
                    <img src="cus-image/fun.png" alt="">
                    <h2>FUN</h2>
                </div>
            </div>
           <button class="back" id="btn">Back</button>
        </div>
       
        <div class="html" id="htmlquiz" style="display: none">
            <div class="html-container" id="html-container">
                <h1>HTML Quiz</h1>

                <!-- Difficulty Level Selection -->
                <label for="difficulty" >Select Difficulty:</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                    <option value="mixed">Mixed (All Levels)</option>
                </select>

                <label for="time">Select time per question:</label>
                <select id="time">
                    <option value="10">10 seconds</option>
                    <option value="15">15 seconds</option>
                    <option value="20">20 seconds</option>
                    <option value="25">25 seconds</option>
                    <option value="30">30 seconds</option>
                    <option value="40">40 seconds</option>
                </select>
            
                <button id="btnStart" onclick="startQuiz()">Start Quiz</button>
            </div>

            
            <!-- Quiz Questions Appear Here -->
             <div class="start-quiz" id="start-quiz" style="display: none;">
                <div id="quiz-container" ></div>

                <button onclick="submitQuiz()" id="submit-btn" style="display:none;">Submit</button>

            </div>
            <div class="show-result" id="show-result" style="display: none;">
                <img src="images/home/logo_quiz.png" alt="">
                <h2 id="result"></h2>
            </div>

            <button class="back" id="back">Back</button>
            
        </div>
    </div>
    
    
</body>
</html>
